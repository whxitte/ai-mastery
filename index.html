<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local AI Lab</title>
  <meta name="description" content="A zero-to-elite study lab for local LLMs: how they work, LM Studio mastery, agents, security workflows, fine-tuning and weight-space editing.">
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171a14" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Open navigation">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/">Local AI Lab</a>
    <button class="icon-btn" data-action="search" aria-label="Search">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn theme-btn" data-action="theme" aria-label="Toggle light or dark theme">
      <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="sb-head">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>
          </span>
          <span>Local AI Lab<small>zero to elite</small></span>
        </a>
        <button class="icon-btn theme-btn" data-action="theme" aria-label="Toggle light or dark theme">
          <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
      <button class="search-trigger" data-action="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search lessons</span><kbd id="search-kbd">Ctrl K</kbd>
      </button>
      <div class="progress">
        <div class="progress-row"><span>Progress</span><span id="progress-text">0 / 0</span></div>
        <div class="progress-bar"><i id="progress-fill"></i></div>
      </div>
      <nav id="nav"></nav>
      <div class="sb-foot">Progress is saved in this browser only.</div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main">
      <div class="content-wrap">
        <div class="col">
          <article class="prose" id="article"></article>
          <div class="lesson-foot" id="lesson-foot"></div>
        </div>
        <aside class="toc" id="toc" aria-label="On this page"></aside>
      </div>
    </main>
  </div>

  <div class="search-modal" id="search" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search lessons">
      <div class="search-input-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search: kv cache, top-p, lora, scope guard…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="search-results"></div>
      <div class="search-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span></div>
    </div>
  </div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/vendor/hljs-dockerfile.min.js"></script>
  <script src="assets/vendor/hljs-django.min.js"></script>
  <script src="content/manifest.js"></script>
  <script src="assets/widgets.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
